name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Tag must match versionName
        run: |
          v=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          [ "$TAG" = "v$v" ] || { echo "::error::tag $TAG does not match versionName $v"; exit 1; }
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::secret for $v is not set; refusing to publish an unsigned release"; exit 1; }
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
      - uses: gradle/actions/setup-gradle@v5
      - name: Test + build signed release
        run: ./gradlew :chatuikit-core:testDebugUnitTest assembleRelease
      - name: Verify signature and name the APK
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs "$apk"
          cp "$apk" "gochatandroid-$TAG.apk"
          sha256sum "gochatandroid-$TAG.apk" > "gochatandroid-$TAG.apk.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber "gochatandroid-$TAG.apk" "gochatandroid-$TAG.apk.sha256"
          else
            gh release create "$TAG" "gochatandroid-$TAG.apk" "gochatandroid-$TAG.apk.sha256" --title "$TAG" --generate-notes
          fi
