name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch live contract for the drift guard
        run: |
          curl -sfL https://raw.githubusercontent.com/gochathub/gochathub-server/main/api/openapi.yaml -o /tmp/live-openapi.yaml
          diff /tmp/live-openapi.yaml api/openapi.yaml || {
            echo "::error::api/openapi.yaml differs from gochathub-server main — refresh the snapshot"
            exit 1
          }
      - uses: gradle/actions/setup-gradle@v5
      - name: Build + unit tests
        run: ./gradlew assembleDebug assembleRelease :chatuikit-core:testDebugUnitTest checkContract