name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch live contract for the drift guard
        run: |
          curl -sfL https://raw.githubusercontent.com/gochathub/gochathub-server/main/api/openapi.yaml -o /tmp/live-openapi.yaml
          diff /tmp/live-openapi.yaml api/openapi.yaml || (
            echo "::warning::api/openapi.yaml snapshot differs from the live server contract"
          )
      - uses: gradle/actions/setup-gradle@v4
      - name: Build + unit tests
        run: ./gradlew assembleDebug :chatuikit-core:testDebugUnitTest checkContract